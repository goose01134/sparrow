<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sparrow Search</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* GLOBAL */
    body {
      font-family: Inter, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }
    /* HEADER */
    #header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 24px;
      margin-bottom: 25px;
    }
    #logo {
      font-family: "Playfair Display", serif;
      font-size: 36px;
      font-weight: 700;
      color: #000;
      letter-spacing: 0.5px;
      user-select: none;
      flex-shrink: 0;
    }
    #searchForm {
      flex: 1;
      display: flex;
      gap: 10px;
    }
    #query {
      flex: 1;
      padding: 12px 16px;
      font-size: 18px;
      font-family: "Playfair Display", serif;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: 0.2s;
    }
    #query:focus {
      border-color: #000;
      outline: none;
    }
    button {
      padding: 12px 22px;
      font-size: 18px;
      font-family: "Playfair Display", serif;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #333;
    }
    /* TABS */
    #tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 6px;
    }
    .tab-btn {
      padding: 8px 16px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: "Playfair Display", serif;
      font-size: 16px;
      letter-spacing: 0.3px;
      border-bottom: 2px solid transparent;
      transition: 0.2s;
    }
    .tab-btn.active {
      border-bottom: 2px solid #000;
      font-weight: 600;
    }
    /* RESULTS */
    #webResults div {
      margin-bottom: 24px;
    }
    #webResults h3 {
      font-family: "Playfair Display", serif;
      font-size: 22px;
      margin-bottom: 6px;
    }
    #webResults a {
      color: #000;
      text-decoration: none;
    }
    #webResults a:hover {
      text-decoration: underline;
    }
    #webResults p {
      font-size: 16px;
      line-height: 1.5;
      color: #444;
    }
    /* IMAGE GRID */
    #imageResults {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }
    #imageResults img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      transition: 0.2s;
    }
    #imageResults img:hover {
      transform: scale(1.03);
    }
    /* PANELS */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body>
  <div id="header">
    <div id="logo">Sparrow</div>
    <form id="searchForm">
      <input type="text" id="query" placeholder="Search..." required>
      <button type="submit">Go</button>
    </form>
  </div>
  <div id="tabs">
    <button class="tab-btn active" data-tab="web">Web</button>
    <button class="tab-btn" data-tab="images">Images</button>
  </div>
  <div id="webPanel" class="tab-panel active">
    <div id="webResults"></div>
  </div>
  <div id="imagesPanel" class="tab-panel">
    <div id="imageResults"></div>
  </div>
</body>
</html>
